<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" fill="none">
  <defs>
    <linearGradient id="gromBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D4ED8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON MARK -->
  <g transform="translate(10, -5)">
    <!-- Golden Orbit Paths & Nodes -->
    <path d="M 68 52 C 72 40, 95 34, 110 40" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 72 55 C 92 41, 116 48, 122 66" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 76 60 C 100 56, 118 70, 120 86" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="68" cy="52" r="3.5" fill="#F59E0B"/>
    <circle cx="110" cy="40" r="3.8" fill="#F59E0B"/>
    <circle cx="122" cy="66" r="3.8" fill="#F59E0B"/>
    <circle cx="120" cy="86" r="3.5" fill="#F59E0B"/>

    <!-- G-Arrow Symbol -->
    <g filter="url(#subtleGlow)">
      <!-- Main circular body of G with smooth curved loop -->
      <path d="M 94 48
               A 42 42 0 1 0 98 94
               L 70 94
               L 100 64"
            fill="none"
            stroke="url(#gromBlue)"
            stroke-width="17"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <!-- Arrow Head -->
      <polygon points="116,48 94,44 100,66" fill="url(#gromBlue)"/>
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <!-- "Gromatic" Wordmark -->
  <text x="165" y="76" font-family="'Space Grotesk', 'Archivo', sans-serif" font-size="52" font-weight="800" letter-spacing="-0.02em" fill="#3B82F6">Gromatic</text>
  <text x="390" y="76" font-family="'Space Grotesk', 'Archivo', sans-serif" font-size="52" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">Space</text>

  <!-- Yellow Accent Line -->
  <line x1="165" y1="92" x2="495" y2="92" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtitle Tagline -->
  <text x="168" y="109" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="0.34em" fill="#60A5FA">DIGITAL MARKETING AGENCY</text>
</svg>
